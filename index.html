<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <meta name="theme-color" content="#6a3fd1">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="img/app_icon_192.png">
    <link rel="apple-touch-icon" href="img/app_icon_180.png">
    <link rel="stylesheet" href="css/Style.css">
    <script type="module" src="js/App.js"></script>
</head>
<body>
    <header class="site-header">
        <h1 data-text="page.heading"></h1>
        <!-- One toolbar: every control the same height (.header-control). On phones it is a
             full-width row under the title, and Copy link shrinks to its icon. -->
        <div class="header-actions">
            <div id="edition" class="segmented header-control" role="group" data-text-label="page.edition_label"></div>
            <details id="saved" class="saved-menu">
                <summary class="header-control" data-text="page.saved"></summary>
                <div id="saved-panel" class="saved-panel"></div>
            </details>
            <button id="copy-link" class="header-control copy-link" type="button" data-text-label="page.copy_link">
                <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
                <span class="copy-label" data-text="page.copy_link"></span>
            </button>
            <div id="language"></div>
        </div>
    </header>

    <main class="layout">
        <div class="inputs">
            <!-- Each section can collapse from its heading (App.js setupCollapsing); the
                 summary says what is chosen while it is closed. -->
            <!-- 1: the item (a grid until one is picked, then a menu on its slot) and its enchantments. -->
            <section class="card collapsible" data-section="wanted">
                <h2><span class="step-badge">1</span><span class="section-title" data-text="page.enchantments_heading"></span><span class="section-summary" id="wanted-summary"></span><button class="collapse-toggle" type="button" aria-expanded="true" aria-controls="wanted-body"></button></h2>
                <div id="wanted-body" class="section-body"><div id="wanted"></div></div>
            </section>

            <section class="card collapsible" data-section="books">
                <h2><span class="step-badge">2</span><span class="section-title" data-text="page.books_heading"></span><span id="books-alert"></span><span class="section-summary" id="books-summary"></span><button class="collapse-toggle" type="button" aria-expanded="true" aria-controls="books-body"></button></h2>
                <div id="books-body" class="section-body"><div id="books"></div></div>
            </section>

        </div>

        <!-- The result: section 4 (the totals and settings), then section 5 (the steps, with
             anvil wear and the Steps/Tree row above them). Both collapse from their heading. -->
        <aside class="results-column">
            <!-- 4: the result. The ? in the heading says how the tiles rank. The level limit is
                 in the settings menu beside the heading (it is usually set once; the button
                 says what it is), so the heading row is a .section-head: the h2, the menu and
                 the collapse arrow. -->
            <section class="card collapsible" data-section="order">
                <div class="section-head">
                    <h2><span class="step-badge">3</span><span class="section-title" data-text="page.results_heading"></span>
                        <span class="info-tip">
                            <button id="rank-help" class="info-tip-button" type="button" aria-expanded="false"
                                aria-controls="rank-help-text" data-text-label="ranking.rank_help_label">?</button>
                            <span id="rank-help-text" class="info-tip-bubble" role="tooltip" data-text="ranking.rank_by"></span>
                        </span>
                        <span class="section-summary" id="order-summary"></span>
                    </h2>
                    <details id="options-menu" class="options-menu">
                        <summary class="options-button" data-text-label="ranking.options">
                            <span id="options-summary" class="options-summary"></span>
                            <svg class="gear-icon" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(0 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(45 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(90 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(135 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(180 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(225 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(270 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="3.4"/></svg>
                        </summary>
                        <div id="limit-panel" class="options-panel"></div>
                    </details>
                    <button class="collapse-toggle" type="button" aria-expanded="true" aria-controls="order-body"></button>
                </div>
                <!-- The tiles (the totals, and the ranking), then the settings: level limit and
                     rename (they change which order wins) and your level (only what the steps show). -->
                <div id="order-body" class="section-body">
                    <div id="metrics" class="metrics-box"></div>
                    <div id="ranking" class="settings"></div>
                </div>
            </section>

            <section class="card collapsible results-card" data-section="steps">
                <h2><span class="step-badge">4</span><span class="section-title" data-text="page.steps_heading"></span><span class="section-summary" id="steps-summary"></span><button class="collapse-toggle" type="button" aria-expanded="true" aria-controls="steps-body"></button></h2>
                <div id="steps-body" class="section-body"><div id="results"></div></div>
            </section>
        </aside>
    </main>
</body>
</html>
