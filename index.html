<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <meta name="theme-color" content="#6a3fd1">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="img/app_icon_192.png">
    <link rel="apple-touch-icon" href="img/app_icon_180.png">
    <!-- The saved light/dark choice, before the page draws (App.js setupTheme). -->
    <script>try { const theme = JSON.parse(localStorage.getItem("enchantment-calculator-theme")); if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme; } catch {}
    // "Show animations" (off) (Settings, Dom.js), before the page draws, so nothing moves on load.
    try { if (JSON.parse(localStorage.getItem("enchantment-calculator-no-motion")) === true) document.documentElement.dataset.motion = "off"; } catch {}
    try { if (JSON.parse(localStorage.getItem("enchantment-calculator-glints")) === false) document.documentElement.dataset.glint = "off"; } catch {}</script>
    <link rel="stylesheet" href="css/Style.css">
    <script type="module" src="js/App.js"></script>
</head>
<body>
    <!-- Spoken updates (Results.js announce): progress while ticking steps. -->
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    <!-- Skip links (App.js setupSkipLinks): the first stops on the page, visible only while focused. Buttons, not #links, since the address's hash holds the setup. -->
    <div class="skip-links">
        <button type="button" class="skip-link" data-skip="steps" data-text="page.skip_steps"></button>
    </div>
    <header class="site-header">
        <h1 data-text="page.heading"></h1>
        <!-- One toolbar: every control the same height (.header-control). On phones it is a
             full-width row under the title, and Copy link shrinks to its icon. -->
        <div class="header-actions">
            <details id="saved" class="saved-menu">
                <summary class="header-control" data-text="page.saved"></summary>
                <div id="saved-panel" class="saved-panel"></div>
            </details>
            <details id="options-menu" class="options-menu">
                <summary class="header-control options-button" data-text-label="ranking.settings">
                    <span id="options-summary" class="options-summary"></span>
                    <svg class="gear-icon" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(0 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(45 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(90 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(135 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(180 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(225 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(270 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.4" rx="0.8" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="3.4"/></svg>
                </summary>
                <div id="limit-panel" class="options-panel"></div>
            </details>
            <button id="copy-link" class="header-control copy-link" type="button" data-text-label="page.copy_link">
                <span class="copy-label" data-text="page.copy_link"></span>
                <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
            </button>
            <button id="feedback" class="header-control feedback-open" type="button" aria-haspopup="dialog">
                <span class="feedback-label"></span>
                <svg class="feedback-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button id="theme" class="header-control theme-toggle" type="button"><span class="theme-label"></span><svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            <div id="language"></div>
        </div>
    </header>

    <main class="layout">
        <!-- The item: a floating card beside the sections on wide windows, a sticky bar over them (condensed to one line once scrolled) on narrow ones.
             Not a section (no number, no collapse); Wanted.js renderItem fills it, and it is hidden until an item is picked. -->
        <div id="item-dock" class="item-dock" hidden><div id="item"></div></div>
        <div class="inputs">
            <!-- Each section can collapse from its heading (App.js setupCollapsing); the
                 summary says what is chosen while it is closed. -->
            <!-- 2: the enchantments (the item grid, numbered 1, until an item is picked; then the item has its own card). -->
            <section class="card collapsible" data-section="wanted">
                <h2 aria-labelledby="wanted-title"><span class="step-badge" aria-hidden="true">2</span><span class="sr-only badge-state" id="wanted-state"></span><span class="section-title" id="wanted-title" data-text="page.enchantments_heading"></span><span class="section-summary" id="wanted-summary"></span><button class="collapse-toggle" type="button" aria-expanded="true" aria-controls="wanted-body"></button></h2>
                <div id="wanted-body" class="section-body"><div id="wanted"></div>
                </div>
            </section>

            <section class="card collapsible" data-section="books">
                <h2 aria-labelledby="books-title"><span class="step-badge" aria-hidden="true">3</span><span id="books-alert"></span><span class="sr-only badge-state" id="books-state"></span><span class="section-title" id="books-title" data-text="page.books_heading"></span><span class="section-summary" id="books-summary"></span><button class="collapse-toggle" type="button" aria-expanded="true" aria-controls="books-body"></button></h2>
                <div id="books-body" class="section-body"><div id="books"></div></div>
            </section>

        </div>

        <!-- The result: section 4 (the steps). Above them, when there is an order, the receipt (what it costs, the anvil wear) and,
             behind it, the four tiles that rank the orders (Ranking.js). -->
        <aside class="results-column">
            <section class="card collapsible results-card" data-section="steps">
                <h2 aria-labelledby="steps-title"><span class="step-badge" aria-hidden="true">4</span><span class="sr-only badge-state" id="steps-state"></span><span class="section-title" id="steps-title" data-text="page.steps_heading"></span><span class="section-summary" id="steps-summary"></span><button class="collapse-toggle" type="button" aria-expanded="true" aria-controls="steps-body"></button></h2>
                <div id="steps-body" class="section-body">
                    <!-- The receipt (renderStepsSummary fills it): the levels, the anvil uses and the wear; the strip opens the ranking tiles under it. Hidden until there is an order. -->
                    <div id="order" class="order" hidden>
                        <div class="order-receipt">
                            <button id="order-toggle" class="order-toggle" type="button" aria-expanded="false" aria-controls="order-panel">
                                <img class="cost-line-orb" src="img/experience_orb.svg" alt="">
                                <span id="order-levels" class="order-levels"></span>
                                <span id="order-uses" class="order-uses"></span>
                                <span class="order-caret" aria-hidden="true">&#9662;</span>
                            </button>
                            <span id="anvil-risk"></span>
                        </div>
                        <div id="order-panel" class="order-panel" hidden>
                            <div class="order-panel-head">
                                <span class="order-panel-title" data-text="ranking.order_title"></span>
                                <span class="info-tip">
                                    <button id="rank-help" class="info-tip-button" type="button" aria-expanded="false"
                                        aria-controls="rank-help-text" data-text-label="ranking.rank_help_label">?</button>
                                    <span id="rank-help-text" class="info-tip-bubble" role="tooltip" data-text="ranking.rank_by"></span>
                                </span>
                            </div>
                            <div id="metrics" class="metrics-box"></div>
                        </div>
                    </div>
                    <div id="results"></div>
                </div>
            </section>
        </aside>
    </main>
    <!-- "Your level" (Options.js renderLevelPop): a popover under the Lv chip in the progress row, placed by Options.js placeLevelPop. -->
    <div id="level-pop" class="level-pop" role="dialog" hidden></div>
</body>
</html>
