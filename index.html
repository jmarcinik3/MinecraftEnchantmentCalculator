<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="css/Style.css">
    <script type="module" src="js/App.js"></script>
</head>
<body>
    <header class="site-header">
        <h1 data-text="page.heading"></h1>
        <div class="header-actions">
            <div id="edition" class="segmented" role="group" data-text-label="page.edition_label"></div>
            <button id="copy-link" class="btn small" type="button" data-text="page.copy_link"></button>
        </div>
    </header>

    <main class="layout">
        <div class="inputs">
            <section class="card">
                <h2><span class="step-badge">1</span><span data-text="page.item_heading"></span></h2>
                <div id="items" class="item-grid"></div>
            </section>

            <section class="card">
                <h2><span class="step-badge">2</span><span data-text="page.enchantments_heading"></span></h2>
                <div id="wanted"></div>
            </section>

            <section class="card">
                <h2><span class="step-badge">3</span><span data-text="page.books_heading"></span><span id="books-alert"></span></h2>
                <div id="books"></div>
            </section>
        </div>

        <aside class="results-column">
            <section class="card results-card">
                <div class="results-header">
                    <h2>
                        <span data-text="page.results_heading"></span>
                        <span class="info-tip">
                            <button id="rank-help" class="info-tip-button" type="button" aria-expanded="false"
                                aria-controls="rank-help-text" data-text-label="ranking.rank_help_label">?</button>
                            <span id="rank-help-text" class="info-tip-bubble" role="tooltip" data-text="ranking.rank_by"></span>
                        </span>
                    </h2>
                </div>
                <div id="ranking" class="ranking"></div>
                <div id="metrics" class="metrics-box"></div>
                <div id="results"></div>
            </section>
        </aside>
    </main>
</body>
</html>
