<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enchantment Calculator</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="site-header">
        <h1>Enchantment calculator</h1>
        <button id="copy-link" class="btn small" type="button">Copy link</button>
    </header>

    <main class="layout">
        <div class="inputs">
            <section class="card">
                <h2><span class="step-badge">1</span>What are you enchanting?</h2>
                <div id="items" class="item-grid"></div>
            </section>

            <section class="card">
                <h2><span class="step-badge">2</span>Enchantments you want</h2>
                <div id="wanted"></div>
            </section>

            <section class="card">
                <h2><span class="step-badge">3</span>Your books</h2>
                <div id="books"></div>
            </section>

            <section class="card">
                <h2 id="existing-title"><span class="step-badge">4</span>Already on your item <span class="optional">optional</span></h2>
                <div id="existing"></div>
            </section>
        </div>

        <aside class="results-column">
            <section class="card results-card">
                <div class="results-header">
                    <h2>Best order</h2>
                    <div id="objective" class="segmented" role="group" aria-label="Optimize for"></div>
                </div>
                <div id="results"></div>
            </section>
        </aside>
    </main>
</body>
</html>
