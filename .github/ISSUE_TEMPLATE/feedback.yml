name: Feedback
description: A correction, suggestion, bug or comment about the site
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: The site's Feedback button fills this in.
      options:
        - Correction
        - Suggestion
        - Bug
        - Comment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, what would make it better, what happened, or what is on your mind? The site's Feedback button fills this in.
    validations:
      required: true
