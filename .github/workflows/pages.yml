# Runs the tests on every push and pull request. On main, deploys the site to GitHub Pages
# only if the tests pass. Can also be started by hand from the Actions tab.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine tests
        run: node test/Engine.test.js
      - name: Logic tests
        run: node test/Logic.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html ServiceWorker.js manifest.webmanifest css js json img font _site/
      # Give each release new file addresses (?v=<commit>), so browsers that cached the
      # last release load the new code instead of mixing old and new files.
      - name: Stamp file references with the commit
        run: bash .github/stamp-version.sh _site "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
